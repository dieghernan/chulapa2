<nav class="chulapa-navbar navbar md:navbar-expand bg-1 border-bottom" aria-label="Primary">
  <div class="container">
    <a class="navbar-brand chulapa-brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#primary-menu" aria-controls="primary-menu" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" id="primary-menu" aria-labelledby="primary-menu-title">
      <div class="drawer-header">
        <h2 class="drawer-title" id="primary-menu-title">Menu</h2>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close menu"></button>
      </div>
      <div class="drawer-body">
        <ul class="navbar-nav">
          {% for item in site.navbar.nav %}
          <li class="nav-item">
            <a class="nav-link{% if page.url == item.url %} active{% endif %}" href="{{ item.url | relative_url | escape }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
          </li>
          {% endfor %}
        </ul>
        {% if show_color_mode_selector %}
        <div class="mt-3 md:mt-0 md:ms-auto" id="site-color-mode-control" hidden>
          <label class="visually-hidden" for="site-color-mode">Color mode</label>
          <select class="form-control form-control-sm" id="site-color-mode">
            <option value="">System theme</option>
            <option value="light">{% if main_skin_scheme == 'dark' %}Primary theme{% else %}Light theme{% endif %}</option>
            <option value="dark">{% if dark_skin_scheme == 'light' and automatic_variant %}Light theme{% elsif dark_skin_scheme == 'light' %}Alternate theme{% else %}Dark theme{% endif %}</option>
          </select>
        </div>
        {% endif %}
      </div>
    </dialog>
  </div>
</nav>
