title: chulapa2
lang: en
url: "https://dieghernan.github.io"
baseurl: "/chulapa2"

googlefonts:
- url: https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap
- url: https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap

color-mode-selector: true
chulapa-skin:
  skin: auto
  autothemer: true
  use-dual-mode: true
  vars:
    font-mono: "Fira Code, ui-monospace, monospace"
navbar:
  nav:
    - title: Home
      url: /
    - title: About
      url: /#about

exclude:
  - .Rproj.user
  - "*.Rproj"
  - .claude
  - .agents
  - .git
  - .grok
  - .posit
  - AGENTS.md
  - README.md
  - node_modules
  - package.json
  - package-lock.json
  - playwright.config.mjs
  - playwright-report
  - scripts
  - skills-lock.json
  - test/browser
  - test-results
