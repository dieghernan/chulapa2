name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build the site with absolute asset URLs
        run: |
          ruby -ryaml -e 'puts({ "url" => ENV.fetch("PAGES_ORIGIN") }.to_yaml)' > "$RUNNER_TEMP/pages.yml"
          bundle exec jekyll build --config "_config.yml,$RUNNER_TEMP/pages.yml" --baseurl "$PAGES_BASE_PATH"
        env:
          JEKYLL_ENV: production
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Verify public asset URLs
        run: |
          for asset in assets/css/brand.css assets/js/color-mode.js; do
            test -s "_site/$asset"
            grep -Fq "\"$PAGES_BASE_URL/$asset\"" _site/index.html
          done
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Keep development fixtures out of the Pages artifact
        run: test ! -e _site/test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v5

  push-gh-pages:
    name: Push the compiled site to gh-pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download the Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: pages-artifact
      - name: Extract the site
        run: |
          mkdir -p published-site
          tar -xf pages-artifact/artifact.tar -C published-site
      - name: Push the site to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: published-site
          force: false
