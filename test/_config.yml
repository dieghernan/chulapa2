url: "http://127.0.0.1:4173"
include:
  - _fixtures

# Start the browser fixtures from Bootstrap defaults.
chulapa-skin: false
chulapa-skin-dark: false
googlefonts: []

auto-themer-preview:
  chulapa-skin:
    autothemer: true
    vars:
      primary: "#285d70"
      link-color: "#842029"
      link-hover-color: "#641821"
  chulapa-skin-dark:
    autothemer: true
    vars:
      link-color: "#ffd9a8"

# Site author for the article header fixtures.
author:
  name: Fixture Author
  url: /test/article/
  location: Madrid
  links:
    - url: https://github.com/dieghernan/chulapa2
      icon: bi bi-github
      label: GitHub
