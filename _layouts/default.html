{%- assign lang = page.lang | default: site.lang -%}
<!doctype html>
<html lang="{{ lang | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != site.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/bootstrap/bootstrap.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/brand.css' | relative_url }}">
  </head>
  <body>
    <a class="visually-hidden-focusable" href="#main-content">Skip to content</a>
    <header>
      {% include navbar.html %}
    </header>
    <main id="main-content" class="container py-5" tabindex="-1">
      <article class="prose">
        {% if page.title %}<h1>{{ page.title | escape }}</h1>{% endif %}
        {{ content }}
      </article>
    </main>
    <script type="module" src="{{ '/assets/bootstrap/bootstrap.bundle.min.js' | relative_url }}"></script>
  </body>
</html>
