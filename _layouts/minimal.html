{%- include snippets/page-language.html -%}
{%- include snippets/theme-options.html -%}
<!doctype html>
<html lang="{{ page_language | escape }}" data-bs-theme="{{ main_mode }}">
  {% include head.html %}
  <body class="d-flex flex-column min-vh-100">
    <a class="visually-hidden-focusable" href="#main-content">Skip to content</a>
    <header class="sticky-top" id="site-header">
      {% include navbar.html %}
    </header>
    {% unless layout.main_content %}
    <div id="main-content" tabindex="-1"></div>
    {% endunless %}
    {{ content }}
    {% include footer.html %}
    {% include components/scripts.html theme=true %}
  </body>
</html>
